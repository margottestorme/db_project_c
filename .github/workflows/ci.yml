name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Build tests
        run: |
          cd src
          gcc -o test tests.c repl.c btree.c

      - name: Run tests
        run: |
          cd src
          ./test
